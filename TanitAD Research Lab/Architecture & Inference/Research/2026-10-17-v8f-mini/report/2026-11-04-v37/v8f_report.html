## 8. Discussion

### 8.1 What is established

1. **The hierarchy runs end to end.** O is steered by T's code (donor code costs 4.4–6.4 m; **[M]**, 4 of 4 checkpoints), T's lateral head reads the route (shuffle 0.82–0.84 → 0.30 F1), and S's checkpoints fall by 4.2 m (50 m) when the nav is shuffled. The typed interface is *used*.
2. **A learned-kinematic floor can be beaten at 6 s**, open loop, with a 7.2 M-parameter head on frozen features (K-1 PASS on M2b, 13–17 %).
3. **Where the remaining 6 s headroom sits is localised:** in the *joint* accuracy of 26 continuous constraint cells (not the decisions), convex in that accuracy, and not reachable by any single input, loss or data lever tested (§7.7).
4. **The main obstacle is on O's side of the interface,** not only T's: O has only seen all-GT or all-own codes (§5.2, §7.6).
5. The variance structure of this rig is quantified, and it dictates experimental design (§5.3): replicates and seeds, not windows.
6. **The margin over the floor survives the model's own motion** (T1-kin, §7.15): 0.83 / 0.79 m of 6 s ADE at both seeds, and 0.79 / 0.71 m with the cameras frozen at the first frame. It holds with a speed bucket built from the past alone (0.77 / 0.73 m), and it is not dominance.
7. **The strategic level works on the model's own motion** (§7.15): S's checkpoints beat a kinematic arc at 30 / 50 / 80 m, separated at both seeds.
8. **Own-state supervision repairs T on the model's own motion** (§7.19): DAgger at p = 0.1 lifts T's lateral and longitudinal macro-F1 at T1-kin past bars that include the run-to-run replicate floor, at both seeds, and cuts the executed 6 s ADE by 0.54 / 0.40 m against its own fine-tune control.
9. **On its own motion the model beats the kinematic floor by 8–10 F of 6 s ADE** (§7.20). It does so with better tactical agreement and halved strategic checkpoint error, and with better speed, heading and cross-track. It also beats its flat control at T1-kin with DAgger. It is not dominant: curvature, L2 and the launch crawl remain worse than the floor.
10. **Given the same DAgger recipe, the hierarchy's lead over flat is not established** (§7.22; T1-kin, paired episode-cluster bootstrap). Own-state supervision helps the flat control as well (ADE6 −0.152 / −0.191 m, separated). DAG's margin over it is −0.3451 m at seed 0 (past the bar) and −0.0544 m at seed 1 (not separated), with family rows separated-worse at both seeds, so item 9's comparison with FLAT is confounded by DAgger. The hierarchy keeps 58 % of its B-2 margin at seed 0 and 15 % at seed 1.
11. **The acceleration term fixes the longitudinal family on DAG's recipe, and position comes along** (§7.23; T1-kin, same estimator). DAG-OACC is the adopted base: accel MAE falls by 56 % / 58 % against DAG (separated), ADE6 is kept, and no longitudinal row is separated-worse than P10 at either seed. The open gap is the crawl set (yaw-rate, curvature, L2 and M1 against P10); the arm aimed at it, DAG-ORC re-based on DAG-OACC, reads HARMS and is not adopted (item 14, §7.26).
12. **The speed information O needs is not recoverable from T's pooled four-frame input by a ridge or a 2 × 256 MLP** (§7.24; T1-class open loop, paired episode-cluster bootstrap). The PRIMARY read-out leaves ADE6 where it was (−0.0097 / +0.0022 m against a bar of −0.1207 m), while the T0 ceiling of the true cells is −0.7164 / −0.6676 m. The scope is that summary on unseen clips: T's full 40-token view is not covered, and T fails on that view too (SPEEDCAL), so the two negatives together route the speed line to perception.
13. **A second DAgger iteration on DAG's own states does not move the crawl rows** (§7.25; T1-kin). R-MOVE fails at both seeds, the crawl rows stay separated-worse against P10, and the swap costs acceleration (+0.5846 / +0.6034 m/s², separated-worse against DAG2-0). DAG stays the base.
14. **O-RECOVER's perturbation composed onto DAG-OACC costs position and does not clear the crawl rows** (§7.26; T1-kin, with R-T0 at T0; paired episode-cluster bootstrap, B = 2,000, 141 episodes). Arm A reads HARMS: R-ADE fails at seed 0 (A − DAG-OACC ADE6 +0.1434 [+0.0538, +0.2342] m, separated-worse) and R-T0 fails at both seeds (+0.1106 / +0.0722 m against +0.0604 m). R-MOVE is false at both seeds: all eight crawl cells are separated-better against DAG-OACC, and each is 8.8–33.8 % of its bar (on the crawl rows the bar is twice the replicate arm's draw: REP s0 − DAG-OACC ADE6 is +0.4025 m, and REP − DAG-OACC is separated on 15 of 19 rows at seed 0). A closes 27.6–79.9 % of DAG-OACC's gap to P10 on the crawl rows, and seven of the eight cells stay separated-worse than P10. DAG-OACC stays the base. (v33: the PI routed past arm B, `PREREG_V8F_DAG_ORC` Amendment 3; LAUNCH-INTENT is item 17.)
15. **An ego-only read-out of T's five speed cells, put into O, cuts ADE6 on M2b-mixo through a declared open channel** (§7.27, SPEEDSUB; T1-class open loop, paired episode-cluster bootstrap, B = 2,000, 141 episodes; PASS, a screening result). ADE6 `ego − own` is −0.1290 [−0.2107, −0.0548] m at seed 0 and −0.0686 [−0.1151, −0.0232] m at seed 1 against a bar of −0.06035 m, and the shuffled-cells control reads +6.7181 / +6.4923 m (separated-worse). The read-out's skill rests mostly on the logged `limit` lane, which carries the ego's own future max speed (`D-SPEEDBAND-EGO-ECHO-1`; TRAIN fold 0: 0.28032 without it against 0.24751 with the full block). Two O training runs, one read-out fit, no replicate arm: this is not a lever claim, and not a statement about DAG-OACC.
16. **With the channel closed, the same kind of read-out does not move healthy DAG-OACC draws** (§7.28, SPEEDSUB-T1; T1-kin, four training runs, paired episode-cluster bootstrap, B = 2,000, 141 episodes). The outcome is NULL, label NULL-ONE: ADE6 `egoc − identity` hits the bar (−0.06035 m, separated) at 1 of 4 runs, the slow-T draw REP s0 (−0.1949 [−0.2619, −0.1313] m); CTRL s0 −0.0233, CTRL s1 −0.0076 and REP s1 −0.0333 m are not separated, and M1 moves at no run. The logged-lane read-out is flat at CTRL too (+0.0008 / −0.0185 m). The speed-cell channel does not limit healthy DAG-OACC draws; its measured use is repairing a slow-T draw.
17. **O's launch-sample along-track weight does not move the crawl rows and fails the position guard: HARMS, arm A is not adopted** (§7.29, LAUNCH-INTENT; T1-kin, paired episode-cluster

18. **The smaller launch crawl sits at the floor of a predictor that is blind to the outcome, and the speed sensitivity belongs to the frozen prior** (§7.30; the gaps are T1-kin, the counterfactual is T0-class; episode-cluster bootstrap, B = 2,000, seed 0; 49 episodes / 327 launch windows). **Established (MEASURED):** for DAG-OACC s0 the model minus the outcome-blind floor is +0.159 [−0.136, +0.468] (median table) and −0.075 [−0.377, +0.232] (mean table) m/s, inside the pre-registered ±0.2 on the point only; the run-to-run launch difference REP − DAG-OACC is −0.556 [−0.699, −0.398] m/s; S_v is +0.736 and +0.628, of which the frozen prior alone is +0.686; the three DAgger-bank pre-steps read a middle band (deficit weighting about 3 times), a recovery label that keeps 59.5 / 62.0 % of the tick-2 states against a predicted 75 to 81 %, and FIT-LIMITED on 2 of 6 checkpoints. **Not established:** that the crawl is a trigger problem rather than a fit problem (these reads do not separate them), anything about the other four checkpoints of the fit-gap card, and whether the 0.556 m/s run difference is between-run or within-run noise (NOT EVALUABLE). One checkpoint pair, no replicate arm (`H-ESTIM-SEED-1`).
19. **The trunk's go/stay edge beyond ego is carried by two ego-future inputs, and the frozen features add a thin increment** (§7.31; T0-class probes of representations on logged inputs; episode-cluster bootstrap on the mean of per-fold AUCs, B = 2,000; one checkpoint). **Established (MEASURED):** P-MOVE dAUC(V+E − E) +0.053 [0.041, 0.066] as frozen (MLP +0.016 [0.007, 0.025]); the frozen pooled P-STOP reading is NOT EVALUABLE (C2 0.4629 [0.4267, 0.49993]); with the nav and the speed ceiling both scrambled the P-STOP trunk residual is Z_nl+E − V+E +0.006 [−0.016, +0.027]; the model's own four frames add nothing. **Not established:** that a nav-free trunk would behave like Z_nl (UNVERIFIED), any statement about a plan (representation probes only), and the TRAIN-window residual on unseen windows.
20. **A uniform two-draw weight average does not move the crawl rows and is not adopted: HARMS** (§7.32; T1-kin, paired episode-cluster bootstrap, B = 2,000, 141 episodes, per seed and per pair; all 368 reader controls PASS). **Established (MEASURED):** R-ADE fails at s0 in both pairs (ADE6 +0.0770 [+0.0213, +0.1348] and +0.0959 [+0.0321, +0.1624] m) and holds at s1; R-MOVE and R-CRAWL are false in all four pairs (0 of 16 crawl cells separated-better, 9 separated-worse); the soup gain on ADE6 is separated-better in five of six cells with no barrier, so the route is FLAT; at s0 the soup recovers 80.9 % and 79.8 % of the slow draw's ADE6 excess and still lands worse than the good draw. **Not established:** an effect of averaging more than two draws (SOUP-K not run), anything at T0 across the four families (NOT RUN), and the T1-kin tactical goal-head F1 (NOT COMPUTABLE). N = 2 per decisive soup; the s0 / s1 difference is the slow draw.

### 8.2 What is not established

* That the **hierarchy** (rather than the frozen prior, the features or the labels) is responsible for the K-1 gain. The capacity-matched FLAT control (`PREREG_V8F_FLAT`) reads **NOT ESTABLISHED**: M2b − FLAT −0.036 / −0.003 m ADE6, n.s. (§7.15).
* That the **hierarchy, rather than the DAgger recipe, earns DAG's margin over flat**. Given the same recipe, DAG − FLAT-DAG ADE6 is −0.3451 [−0.4421, −0.2506] m at seed 0 (past the bar) and −0.0544 [−0.1605, +0.0547] m at seed 1 (not separated), and family rows are separated-worse at both seeds. The outcome is NOT ESTABLISHED (§7.22; T1-kin), and one training run per seed cannot say which seed is typical.
* That **T's decisions hold on the model's own motion**: they do not. Lateral F1 falls from 0.85 to 0.61 / 0.63 at T1 (§7.15). O-RECOVER moved the lateral errors on the model's own motion but read HARMS on position (§7.18). DAgger (§7.19) lifts lat F1 at ticks ≥ 1 to 0.60 / 0.64 (DAG-0 0.49 / 0.52), separated and past its bar. The gap to tick 0's 0.85 narrows; it is not closed.
* That the **strategic layer** adds anything over a nav-only kinematic extrapolation *on the deployed schedule*: at its own tick it does (−2.4 to −2.5 m at 50 m, §7.8); on the deployed schedule its checkpoint metric includes the travel since its tick, and whether that staleness costs the plan is unmeasured.
* Any **driving** claim: all numbers are open loop (T0/T1), and no T2 closed-loop run exists. The T1-kin read (§7.15) keeps the human's cameras. Its speed input can be built from the past alone without losing the margin, but frozen cameras together with that causal bucket are not measured. Without the post-map, the raw arms are worse than the floor at 2 s and in acceleration.
* That any T-side lever can reach the headroom. T_ATTRIB's ceilings are ≤ 0.17 m for every stratum considered **[E]**, below $2F$.
* Transfer: one corpus, one recording-session split, no out-of-distribution evaluation.

## 9. Limitations and threats to validity

1. **Tier.** Everything is open loop. The own-code evaluation has the ego state arriving from the recording; the oracles read the future. A driving claim needs T2.
2. **Estimator scope.** Intervals answer "another draw of *episodes*". Training-seed variance enters only through $F$, estimated from **two** seeds (95 % interval on the seed SD spans ×70). Most arms have one seed (seed 0 gates seed 1). The 9.5 % replicate false-positive rate is inherited from a smaller rig **[I]**.
3. **Eval size.** 141 episodes, 17 windows each; several strata have tens of windows (e.g. 45 left-turn windows), and some conclusions rest on 7–14 episodes (T-error concentration).
4. **Optimistic inputs.** The nav token and the per-clip speed limit are *supplied*; on this corpus the nav is derived from the ego's own recorded future path, so strategic and tactical numbers are optimistic by construction; a deployed system needs a *predicted* goal. The key guard checks which keys are read, not their provenance.
5. **No flat control, no external baseline.** The hierarchy's necessity is untested; no published baseline exists on our split.
6. **Oracles are not driving.** They read quantities computed from the future; frozen-O partial oracles cannot size a training change (R63) and are lower bounds (§5.2).
7. **Short-horizon and acceleration defects** are unexplained: B's ADE2 is 27–44 % above P10 (H removes this, §7.12, at a consistency cost), acceleration MAE is worse in all runs, and a Savitzky–Golay filter does not repair it. The cosine basis is band-limited (≈ 0.92 Hz), so the roughness's origin is **[U]**.
8. **The instrument floor** is not zero: the GT plan violates 7.9 % of windows under the consistency rules (the speed rule uses one limit per clip).
9. **Retracted readings, so far (root-cause class in brackets).** R63 *an error metric judged against a convention its consumer does not use*; R66 *a one-seed gain read against the wrong floor*; R69 *a gain measured against one baseline draw*; R70 *a train-loss difference read as a mechanism without its sampling error*; R71 *a contrast between strata that a gate selected, where the gate also drives the outcome* (the "route-silent turn" proof of existence shrank from 0.95 vs 0.40 to a like-for-like 0.65 vs 0.41 SD on 37 windows, because the nav speaks only on slow junction turns). Source texts in `R/` still contain some retracted statements with strike-through notes; where they conflict, this report follows the corrections.
10. **Source conflicts found while writing (registry/raw JSON wins).** (a) Tier: registry T0 vs verdict "T1-class". (b) `RESULT_V8F_TAC_A2.md` "mismatch" vs R63. (c) "T is generalisation-limited" (WC, HIST, DSCALE) vs R70. (d) Registry §17 "distance keeping UNAVAILABLE" vs the DK erratum. (e) Line numbers `:601-602`/`:620-622` vs `:627`/`:637` at the tip. (f) The PREREG cites the banked P10 (6 s 2.9257) while K-1 uses P10-yaw-4512 (2.4870). (g) The register lists STRAT-1 as OPEN while the banked paired numbers already fail clause 1.
11. **Not verified by me.** Related-work descriptions beyond the library index; the contents of the rung-β and SMOOTH/LON read files (cited from the register); MIXO's training state; the figures' underlying `.out` text files (T_ATTRIB tables are quoted from `T_ATTRIB.md`, not recomputed). I cross-checked against raw JSON: K-1 and WM-1 (`verdict.json`), the oracle table (`tac_read.json`), group and dose tables, the KIND tables and additivity, the five lever-arm deltas and their mechanism cells, the STRAT paired numbers and the P10 floors.
12. **v34 reads and their limits.** The crawl diagnosis (§7.30) rests on one checkpoint pair (DAG-OACC s0 and REP s0) for the gaps and S_v, on two M2b checkpoints for the fit-gap ratio, and on banks built from them; the 327 launch windows are 49 episodes, so the intervals on the model-minus-floor difference are wide (half-width about 0.30 m/s). The trigger probes (§7.31) are representation probes on one checkpoint (DAG-OACC s0), fitted and scored on TRAIN windows that checkpoint trained on, and their TRAIN cache and rebuilt join are UNVERIFIED byte for byte against box 2's copies; the nav token and the speed ceiling are ego-future channels. The SOUP read (§7.32) averages two draws (N = 2 per decisive soup) at two seeds, one of which has a slow draw, and the bootstrap is blind to training variance. The fine-token probes (§7.33) carry the limits stated in that section. The two literature reviews behind the v34 related-work paragraphs are read through their own sentences and page numbers; beyond them the descriptions are UNVERIFIED.
13. **v35 reads and their limits.** The seven reads of §7.34 use one set of 141 eval episodes (2,399 windows) for six rollout reads, each lever chosen after the earlier reads were seen; one training run per seed (DAG-OACC and SOUP at s0 and s1), no replicate arm, and an interval that answers another draw of episodes only (`H-ESTIM-SEED-1`). The committed outcome rules of the cards are quoted from the register rows and the RESULTS files; the card texts were hashed (sha256) but not re-read in v35 (**UNVERIFIED** against the card text). SMOOTH-T1's decision baseline is the fresh unsmoothed run Y' under a control-only amendment written after the 1-thread tables had been seen, with tolerances from one replicate pair. The GAPDECOMP shares are decompositions of a measured gap, not interventions, and the yaw-rate share is unstable (s0 −0.424 against s1 +0.205). Probe 5 is a T0-class readout (one PCA-64 and L2 linear readout on one frame of one frozen encoder) with a JPEG transport step (median 6.4 % feature change) that was not gated, and one card item (a pixel test) was not run (UNVERIFIED). The tactical goal-head F1 is not computed at T1-kin and the family reads of the rollout studies are the plan-derived rows. HISTSWAP and HISTSWAP-LF are read in v36 (§7.35, item 14); FRAMEFREEZE (as the control of the recovery reads), RECOVER-FT and RECOVER-NEXT are read in v37 (§7.36, item 15).
14. **v36 reads and their limits.** The two reads of §7.35 use the same 141 eval episodes (2,399 windows) as §7.34, one training run per seed (DAG-OACC and SOUP at s0 and s1), no replicate arm, and an interval that answers another draw of episodes only (`H-ESTIM-SEED-1`); X and Y share a checkpoint, so no training-seed variance sits inside X − Y. Both closing arms (HISTSWAP and HLVL) are oracles that read the human's speed, and HISTSWAP also leaks the human's realised motion at ticks 1 and 2. HLVL's closure is near-mechanical: the plan is `P + O's delta` and the prior's anchor follows the input speed. HCV removes all acceleration information, so *trend alone* is untested (HTRND not run), and whether its harm is the missing information or an off-distribution input is UNVERIFIED. The class split of the M1 row is by situation class and not by v0 band. The S-POS rows of the swapped arms are UNVERIFIED, and HLVL's HARMS label rests on them alone. T1-kin applies the model's own plan to its own state with logged cameras that advance at the human's pace; the frame-freeze control was not run on any arm of these reads. The card texts were hashed (sha256) and their rules quoted from the RESULTS files and the register; the card texts were not re-read line by line in v36 beyond the quoted passages. FRAMEFREEZE, RECOVER-FT and RECOVER-NEXT are read in v37 (§7.36, item 15), and the level probes in §7.35.4.

15. **v37 reads and their limits.** The level probes (§7.35.4) are oracle diagnostics on the same 141 eval episodes as §7.34 and §7.35, with one checkpoint per cell, and their Stage 1 image probe covers the v0 < 6 m/s windows only. The recovery reads (§7.36) are TRAINED arms with one training run per seed and a same-init replicate C0rep as the training-run floor (`H-ESTIM-SEED-1`): at s0 every arm's M1 effect sits inside that floor and at s1 outside it, so the seed-level evidence is split. The paired episode-cluster bootstrap answers another draw of episodes only. T1-kin applies the model's plan to its own state with logged cameras that advance at the human's pace; the frame-freeze control reads PARTIAL for every recovery arm (RAPR's closure is kept under frozen frames, and the bar is still not met). The S-POS rows are reported and counted for v8F (STRATEGIC active, PI ruling 2026-10-17). No T2 number exists. The card texts were hashed (sha256) and their rules quoted from the RESULTS files and the register.
