  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, b) => { math.push("$$" + b + "$$"); return "@@MATH" + (math.length - 1) + "@@"; });
  src = src.replace(/(^|[^\\$])\$([^\s$](?:[^$\n]*?[^\s$\\])?)\$/g, (m, pre, b) => { math.push("\\(" + b + "\\)"); return pre + "@@MATH" + (math.length - 1) + "@@"; });
  // 3. code back for the parser, then parse
  src = src.replace(/@@CODE(\d+)@@/g, (m, i) => code[+i]);
  let html;
  try { html = marked.parse(src, { gfm: true }); }
  catch (e) { doc.innerHTML = '<p class="err">The report could not be rendered: ' + esc(String(e)) + "</p>"; return; }
  html = html.replace(/@@MATH(\d+)@@/g, (m, i) => esc(math[+i]));
  doc.innerHTML = html;
  // tables scroll inside their own box
  doc.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tablewrap"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  // the video sits right after the abstract
  const abs = [...doc.querySelectorAll("h2")].find(h => /Abstract/i.test(h.textContent));
  const fig = document.createElement("figure");
  fig.className = "video";
  fig.innerHTML = '<video controls muted playsinline preload="metadata" src="v8f_hierarchy_attention.mp4"></video>' +
    '<figcaption><b>Video</b>The cross-attention of each level, drawn on the frame that level last ticked at, for four whole eval clips chosen by a rule fixed before rendering: the median window of each stratum (JUNCTION, CURVE, NO-TURN) and the single worst window. ' +
    'Arm M2b seed 0, T0 open loop, qualitative. S in magenta, T in blue, O in amber. The bird’s-eye panel shows the logged path, O’s plan from its own code and S’s checkpoints. Section 7.11 gives the controls and the aggregate statistics.</figcaption>';
  if (abs) { let n = abs.nextElementSibling; while (n && n.tagName !== "H2" && n.tagName !== "HR") n = n.nextElementSibling; (n || doc).parentNode === doc ? doc.insertBefore(fig, n) : doc.appendChild(fig); }
  // the second video sits under its own section (7.14)
  const h714 = [...doc.querySelectorAll("h3")].find(h => /evidence video 2/i.test(h.textContent));
  if (h714) {
    const fig2 = document.createElement("figure");
    fig2.className = "video";
    fig2.innerHTML = '<video controls muted playsinline preload="metadata" src="v8f_evidence_v5.mp4"></video>' +
      '<figcaption><b>Video 2 (v5, 536 s)</b>Nine chapters; v5 adds chapter 8, <b>DAgger: trained on its own states</b> (DAG vs DAG-0 on their own motion; S checkpoints, T decisions against the label and O executed path at every replan tick; seven rule-selected windows, the worst kept; T1-kin, self-action OPEN loop). v4 added chapter 7, <b>T1-kin: the model on its own motion</b> (seven windows chosen by a rule fixed before any per-window T1 number, failures kept; the per-window distribution; the causal, strict and lateral-gap cards; self-action OPEN loop, not closed loop). The v3 chapters: who listens to what (§7.13); the nav counterfactual on four pre-declared windows and over all 2,399; better plans by horizon, now with HACC drawn beside H, P10, B and the logged path; ' +
      '<b>dominance over the kinematic prior</b> (HACC − P10 on all 15 rows, both seeds, and where the acceleration gap went); S at its own tick; closing. ' +
      'Arms M2b and M2b + HACC, seeds 0 and 1, T1-class open loop, NOT closed loop; P10 is the programme’s kinematic floor, not the state of the art. The counterfactual is an intervention on the model’s input, not driving. The strategic family is in force for v8F (PI, 2026-10-17).</figcaption>';
    h714.parentNode.insertBefore(fig2, h714.nextElementSibling);
  }
  // contents rail
  const toc = document.getElementById("toc");
  doc.querySelectorAll("h2, h3").forEach((h, k) => {
    h.id = "s" + k;
    const a = document.createElement("a");
    a.href = "#" + h.id; a.textContent = h.textContent; if (h.tagName === "H3") a.className = "sub";
    toc.appendChild(a);
  });
  const typeset = () => window.MathJax.startup.promise.then(() => window.MathJax.typesetPromise([doc])).catch(() => {});
  if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) typeset();
  else document.getElementById("mj").addEventListener("load", typeset);
})();
</script>
