hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    root: null
    disable_existing_loggers: false
  job_logging:
    version: 1
    root: null
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - pkg://nuplan.planning.script.config.common
  - pkg://nuplan.planning.script.experiments
  callbacks: {}
  output_subdir: ${output_dir}/code/hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +simulation=closed_loop_nonreactive_agents_driverl
    - scenario_builder=nuplan
    - scenario_builder.db_files=E:/Projects/TanitAD/data/nuplan/nuplan-v1.1/splits/test
    - scenario_filter=driverl_test14_random
    - scenario_filter.shuffle=false
    - worker=ray_distributed
    - worker.use_distributed=false
    - worker.threads_per_node=3
    - worker.log_to_driver=false
    - distributed_mode=SINGLE_NODE
    - number_of_gpus_allocated_per_simulation=0.0
    - number_of_cpus_allocated_per_simulation=1
    - max_callback_workers=0
    - disable_callback_parallelization=true
    - ~callback.simulation_log_callback
    - planner=driverl_nuplan_planner
    - ego_controller=driverl_one_stage_controller
    - planner.driverl_nuplan_planner.device=cpu
    - planner.driverl_nuplan_planner.config_path=C:/Users/Admin/dz/DriveZero/DriveRL/release/configs/driverl_teacher.yaml
    - planner.driverl_nuplan_planner.checkpoint_path=C:/Users/Admin/dz/DriveZero/DriveRL/release/checkpoints/checkpoint_2400.pt
    - planner.driverl_nuplan_planner.route_goal_horizon_s=12.0
    - planner.driverl_nuplan_planner.route_goal_min_speed_mps=5.0
    - planner.driverl_nuplan_planner.route_goal_pair_mode=legacy
    - planner.driverl_nuplan_planner.tts_enabled=false
    - planner.driverl_nuplan_planner.tts_num_candidates=8
    - planner.driverl_nuplan_planner.tts_seed=42
    - ego_controller.device=cpu
    - ego_controller.nuplan_bicycle_max_acceleration=4.0
    - ego_controller.nuplan_bicycle_max_steering_rate=0.8
    - output_dir=F:/tanitad_scratch/tf_e3/runB4/closed_loop_nonreactive_agents/out
    - experiment_name=closed_loop_nonreactive_agents_driverl_e3_out
    - exit_on_failure=true
    - ~main_callback.metric_summary_callback
  job:
    name: run_simulation
    chdir: null
    override_dirname: +simulation=closed_loop_nonreactive_agents_driverl,disable_callback_parallelization=true,distributed_mode=SINGLE_NODE,ego_controller.device=cpu,ego_controller.nuplan_bicycle_max_acceleration=4.0,ego_controller.nuplan_bicycle_max_steering_rate=0.8,ego_controller=driverl_one_stage_controller,exit_on_failure=true,experiment_name=closed_loop_nonreactive_agents_driverl_e3_out,max_callback_workers=0,number_of_cpus_allocated_per_simulation=1,number_of_gpus_allocated_per_simulation=0.0,output_dir=F:/tanitad_scratch/tf_e3/runB4/closed_loop_nonreactive_agents/out,planner.driverl_nuplan_planner.checkpoint_path=C:/Users/Admin/dz/DriveZero/DriveRL/release/checkpoints/checkpoint_2400.pt,planner.driverl_nuplan_planner.config_path=C:/Users/Admin/dz/DriveZero/DriveRL/release/configs/driverl_teacher.yaml,planner.driverl_nuplan_planner.device=cpu,planner.driverl_nuplan_planner.route_goal_horizon_s=12.0,planner.driverl_nuplan_planner.route_goal_min_speed_mps=5.0,planner.driverl_nuplan_planner.route_goal_pair_mode=legacy,planner.driverl_nuplan_planner.tts_enabled=false,planner.driverl_nuplan_planner.tts_num_candidates=8,planner.driverl_nuplan_planner.tts_seed=42,planner=driverl_nuplan_planner,scenario_builder.db_files=E:/Projects/TanitAD/data/nuplan/nuplan-v1.1/splits/test,scenario_builder=nuplan,scenario_filter.shuffle=false,scenario_filter=driverl_test14_random,worker.log_to_driver=false,worker.threads_per_node=3,worker.use_distributed=false,worker=ray_distributed,~callback.simulation_log_callback,~main_callback.metric_summary_callback
    id: ???
    num: ???
    config_name: default_simulation
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: C:\Windows\System32
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: C:\Users\Admin\dz\DriveZero\DriveRL\nuplan-devkit\nuplan\planning\script\config\simulation
      schema: file
      provider: main
    - path: nuplan.planning.script.config.common
      schema: pkg
      provider: hydra.searchpath in main
    - path: nuplan.planning.script.experiments
      schema: pkg
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: F:\tanitad_scratch\tf_e3\runB4\closed_loop_nonreactive_agents\out
    choices:
      simulation: closed_loop_nonreactive_agents_driverl
      simulation_time_controller: step_simulation_time_controller
      planner: driverl_nuplan_planner
      ego_controller: driverl_one_stage_controller
      observation: box_observation
      simulation_metric: simulation_closed_loop_nonreactive_agents
      worker: ray_distributed
      scenario_filter: driverl_test14_random
      scenario_builder: nuplan
      scenario_builder/scenario_mapping: nuplan_scenario_mapping
      scenario_builder/vehicle_parameters: nuplan_vehicle_parameters
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: none
      hydra/hydra_logging: none
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
