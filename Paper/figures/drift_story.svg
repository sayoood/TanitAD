<text x="40" y="44" font-size="24" font-weight="700" fill="#0b0b0b">The drift attractor: manufactured by training, untouched by the teacher</text>
<text x="40" y="68" font-size="12.5" fill="#52514e">MM-E1: both 2 k EMA-teacher effects INVERT at 30 k — the pre-registered transient account confirmed (fixed τ = 0.996 is 12.5 % of a 2 k run, 0.83 % of a 30 k run) — and the frozen crossed cell prices the manufactured share.</text>
<text x="40" y="86" font-size="12.5" fill="#52514e">Tier T0-DIAGNOSTIC — world-model diagnostics, never driving performance · drift instrument: RFF+ridge, K-fold clip-disjoint, top-8 PCA of Δz at k = 4, 80 held-out clips · every value read from the banked probe JSONs at generation time.</text>
