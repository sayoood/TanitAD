<text x="880" y="511" font-size="11.2" font-weight="400" fill="#52514e">touching encoder, head or emission.</text>
<text x="880" y="541" font-size="11.2" font-weight="400" fill="#52514e">On the repaired trunk the fan is healthy and</text>
<text x="880" y="556" font-size="11.2" font-weight="400" fill="#52514e">the roll-cost becomes the best-calibrated</text>
<text x="880" y="571" font-size="11.2" font-weight="400" fill="#52514e">selection signal the programme has measured</text>
<text x="880" y="586" font-size="11.2" font-weight="400" fill="#52514e">(ρ 0.716 vs ≤ 0.26 for every learned scorer).</text>
<text x="880" y="616" font-size="11.2" font-weight="400" fill="#52514e">Imagination is load-bearing, not decorative:</text>
<text x="880" y="631" font-size="11.2" font-weight="400" fill="#52514e">removing its content costs 19× in ADE, and</text>
<text x="880" y="646" font-size="11.2" font-weight="400" fill="#52514e">breaking only the correspondence still costs 3×.</text>
<text x="40" y="684" font-size="9.8" fill="#8a8880">Selection is NOT closed by this arc: the selector-free full-fan run has since failed the same ≤ 0.4505 gate at 3.335 m over a 0.127 m oracle — see Figure 3. Failed gates are reported as results.</text>
