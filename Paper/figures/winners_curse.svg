<text x="782" y="161" font-size="14.5" font-weight="700" fill="#0b0b0b">Where the argmin actually lands</text>
<text x="782" y="179" font-size="10.6" fill="#52514e">rank of the chosen candidate&#x27;s realised error, 1 = best of 256</text>
<text x="782" y="194" font-size="10.6" fill="#8a8880">a selector with tail information lands near 1. This one lands on the median.</text>
<rect x="790" y="252" width="384" height="13" rx="6" fill="#e6e5e1"/>
<circle cx="790.0" cy="258.5" r="6" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="790.0" y="242" font-size="10.2" text-anchor="start" fill="#2a78d6">rank 1 = oracle</text>
<text x="790.0" y="282" font-size="10.2" text-anchor="start" fill="#8a8880">0.1273 m</text>
<line x1="981.2" y1="246" x2="981.2" y2="271" stroke="#4a3aa7" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="981.2" y="242" font-size="10.2" text-anchor="middle" fill="#4a3aa7">chance = 128</text>
<circle cx="987.8" cy="258.5" r="7.5" fill="#eb6834" stroke="#ffffff" stroke-width="2.4"/>
<text x="987.8" y="296.0" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round">argmin: rank 132.3</text><text x="987.8" y="296.0" font-size="12" font-weight="700" text-anchor="middle" fill="#eb6834">argmin: rank 132.3</text>
<text x="1174.0" y="282" font-size="10.2" text-anchor="end" fill="#8a8880">256</text>
<text x="782" y="322" font-size="10.4" fill="#8a8880">within-window rank corr. (over the 256)</text>
<text x="782" y="336" font-size="11.4" font-weight="700" fill="#0b0b0b">rho 0.445 mean / 0.497 median</text>
<text x="782" y="350" font-size="10.4" fill="#8a8880">across-window calibration</text>
<text x="782" y="364" font-size="11.4" font-weight="700" fill="#0b0b0b">rho 0.3185 [0.2064, 0.4086]</text>
<text x="782" y="378" font-size="10.4" fill="#8a8880">true best candidate available</text>
<text x="782" y="392" font-size="11.4" font-weight="700" fill="#0b0b0b">100% of windows (no shortlist)</text>
<text x="782" y="414" font-size="10.2" fill="#52514e">The cost ranks the bulk correctly and carries no information in the tail —</text>
<text x="782" y="428" font-size="10.2" fill="#52514e">and the tail is the only part an argmin reads.</text>
<rect x="40" y="460" width="700" height="292" rx="7" fill="#ffffff" stroke="#dedcd6" stroke-width="1"/>
<text x="58" y="487" font-size="14.5" font-weight="700" fill="#0b0b0b">What each selection rule scores, same fan</text>
<text x="58" y="505" font-size="10.6" fill="#52514e">selected ADE (m), lower is better · T0 diagnostic on the 881-window held-out grid</text>
<text x="58" y="520" font-size="10.6" fill="#8a8880">the deployed number comes from the kinematic term; roll consistency alone selects nothing.</text>
<text x="266" y="562" font-size="10.6" text-anchor="end" fill="#52514e">fan oracle (best available)</text>
<rect x="276" y="548" width="8.3" height="19" rx="4" fill="#2a78d6"/>
<text x="292.3" y="562.1" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round">0.1273</text><text x="292.3" y="562.1" font-size="11" font-weight="700" text-anchor="start" fill="#0b0b0b">0.1273</text>
<text x="266" y="594" font-size="10.6" text-anchor="end" fill="#52514e">pre-registered gate</text>
<line x1="305.4" y1="576" x2="305.4" y2="603" stroke="#4a3aa7" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="313.4" y="594.1" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round">0.4505</text><text x="313.4" y="594.1" font-size="11" font-weight="700" text-anchor="start" fill="#4a3aa7">0.4505</text>
<text x="266" y="626" font-size="10.6" text-anchor="end" fill="#52514e">W7-FULL: roll + 0.2 x kinematic</text>
<rect x="276" y="612" width="217.3" height="19" rx="4" fill="#eb6834"/>
<text x="501.3" y="626.1" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round">3.335</text><text x="501.3" y="626.1" font-size="11" font-weight="700" text-anchor="start" fill="#0b0b0b">3.335</text>
<text x="266" y="658" font-size="10.6" text-anchor="end" fill="#52514e">frozen selector on the same fan</text>
<rect x="276" y="644" width="287.8" height="19" rx="4" fill="#eb6834"/>
<text x="571.8" y="658.1" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round">4.416</text><text x="571.8" y="658.1" font-size="11" font-weight="700" text-anchor="start" fill="#0b0b0b">4.416</text>
<text x="266" y="690" font-size="10.6" text-anchor="end" fill="#52514e">argmin on roll consistency alone</text>
<rect x="276" y="676" width="344.7" height="19" rx="4" fill="#eb6834"/>
<text x="628.7" y="690.1" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round">5.290</text><text x="628.7" y="690.1" font-size="11" font-weight="700" text-anchor="start" fill="#0b0b0b">5.290</text>
<text x="266" y="722" font-size="10.6" text-anchor="end" fill="#52514e">rank blend of the two costs</text>
<rect x="276" y="708" width="355.9" height="19" rx="4" fill="#eb6834"/>
<text x="639.9" y="722.1" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round">5.462</text><text x="639.9" y="722.1" font-size="11" font-weight="700" text-anchor="start" fill="#0b0b0b">5.462</text>
<line x1="276" y1="540" x2="276" y2="736" stroke="#e6e5e1" stroke-width="1.2"/>
<rect x="764" y="460" width="436" height="292" rx="7" fill="#f3f6fa" stroke="#d6dde6" stroke-width="1"/>
<text x="782" y="487" font-size="14.5" font-weight="700" fill="#0b0b0b">The mechanism</text>
<text x="782" y="506" font-size="11.2" fill="#52514e">A rank correlation is a BULK statistic. An argmin is an</text>
<text x="782" y="522" font-size="11.2" fill="#52514e">EXTREME one. What governs selection is lower-tail</text>
<text x="782" y="538" font-size="11.2" fill="#52514e">dependence — and here it is zero.</text>
<text x="782" y="570" font-size="11.2" fill="#52514e">A self-consistency cost (does the world model reproduce</text>
<text x="782" y="586" font-size="11.2" fill="#52514e">this candidate?) is minimised by a near-stationary</text>
<text x="782" y="602" font-size="11.2" fill="#52514e">candidate, whose realised error is large. Deepening the</text>
<text x="782" y="618" font-size="11.2" fill="#52514e">fan makes such a candidate more likely, so the argmin</text>
<text x="782" y="634" font-size="11.2" fill="#52514e">degrades while the oracle improves.</text>
<text x="782" y="666" font-size="11.2" fill="#52514e">V-JEPA 2-AC and DINO-WM minimise distance to a GOAL,</text>
<text x="782" y="682" font-size="11.2" fill="#52514e">which inaction cannot minimise. We copied the planning</text>
<text x="782" y="698" font-size="11.2" fill="#52514e">loop and dropped that term; W7&#x27;s own progress term has</text>
<text x="782" y="714" font-size="11.2" fill="#52514e">been at weight 0.0 in every run to date.</text>
<text x="40" y="776" font-size="9.8" fill="#8a8880">Sources (MEASURED, ours): w7_full_gate.json and w4r_gate.json (gate PASS), plus the 0-GPU sweep w7_selection_rules.json, whose own artifact stamps it EXPLORATORY —</text>
<text x="40" y="790" font-size="9.8" fill="#8a8880">a rule chosen from it must be re-measured on a fresh grid. Point estimates are corpus-grid means over the fixed grid; the two correlations carry the episode-cluster bootstrap.</text>
</svg>