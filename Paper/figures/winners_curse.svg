<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 806" width="1240" height="806" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1240" height="806" fill="#fcfcfb"/>
<text x="40" y="46" font-size="25" font-weight="700" fill="#0b0b0b">The winner&#8217;s curse: a fan that contains the answer, and a rule that cannot find it</text>
<text x="40" y="70" font-size="12.5" fill="#52514e">W7-FULL, selector-free: all 256 candidates available in every window (the true best is never excluded), on the repaired trunk with a refit emission head.</text>
<text x="40" y="88" font-size="12.5" fill="#52514e">Tier T0 — a world-model diagnostic, never driving performance · 881 held-out windows / 40 episodes · every value read from the gate JSONs at generation time.</text>
<circle cx="46" cy="106" r="5" fill="#2a78d6"/>
<text x="58" y="110" font-size="11" fill="#52514e">headroom that exists in the fan</text>
<circle cx="272" cy="106" r="5" fill="#eb6834"/>
<text x="284" y="110" font-size="11" fill="#52514e">what an argmin rule delivers</text>
<line x1="500" y1="106" x2="526" y2="106" stroke="#4a3aa7" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="534" y="110" font-size="11" fill="#52514e">pre-registered gate or reference</text>
<line x1="40" y1="120" x2="1200" y2="120" stroke="#e6e5e1" stroke-width="1.2"/>
<rect x="40" y="134" width="700" height="306" rx="7" fill="#ffffff" stroke="#dedcd6" stroke-width="1"/>
<text x="58" y="161" font-size="14.5" font-weight="700" fill="#0b0b0b">Conditioning on the cost does not change the error distribution</text>
<text x="58" y="179" font-size="10.6" fill="#52514e">realised ADE (m) of the candidates inside the cost&#x27;s own top-m, over 256 candidates x 881 windows</text>
<text x="58" y="194" font-size="10.6" fill="#8a8880">if the cost selected, the orange line would fall with m. It does not: it sits on the fan&#x27;s own mean.</text>
