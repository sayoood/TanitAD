<text x="40" y="756" font-size="9.8" fill="#8a8880">L1&#8217;s prediction collapse, four ways: nrmse 1.0162 exceeds 1.0 AND its own mean-only control 0.9984; 98.8 % of the predicted Δz IS the batch mean; the centred cosine falls from 11.26σ to 0.72σ against its permutation null.</text>
<text x="40" y="770" font-size="9.8" fill="#8a8880">Four cross-artifact tripwires passed: the base arm&#8217;s drift and cos agree across the O14 and drift ladders; the 2 k incumbent&#8217;s drift across ladder and bake-off; the 30 k incumbent&#8217;s cos across its own raw and the EMA pair&#8217;s. Deltas are arithmetic on loaded values.</text>
