<text x="40" y="68" font-size="12.5" fill="#52514e">MM-E4 L1 cut drift by 25.0 % — the largest reduction ever measured on the trainable line — and cost 95.6 % of prediction, failing the pre-committed protection. The EMA teacher at 30 k moved BOTH the other way.</text>
<text x="40" y="86" font-size="12.5" fill="#52514e">Tier T0-DIAGNOSTIC — world-model diagnostics, never driving performance · drift instrument: RFF+ridge, K-fold clip-disjoint, top-8 PCA of Δz at k = 4, 80 held-out clips · every value read from the banked probe JSONs at generation time.</text>
