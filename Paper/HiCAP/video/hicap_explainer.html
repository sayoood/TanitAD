<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>HiCAP Explainer</title>
<!--
  HiCAP architecture explainer — deterministic motion graphics.
  window.renderFrame(t) draws the frame at time t (seconds) as a pure function of t
  (no wall clock, no requestAnimationFrame in the render path). render_video.js steps t at 30 fps.
  Every number shown is quoted from Paper/HiCAP/*.tex, Paper/HiCAP/design/HICAP_V10_SPEC.md or
  stack/tanitad/hicap/ (see storyboard.md for the per-chapter source list). Nothing has been trained:
  where results would go the video says "not yet trained". Bars, posteriors and selections drawn
  without numbers are ILLUSTRATIVE and are labelled as such on screen.
  Open this file directly in a browser for a scrubbable preview (space = play/pause).
-->
<style>
  html, body { margin: 0; background: #070a10; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 12px; align-items: center;
        padding: 8px 16px; background: rgba(0,0,0,.6); font: 14px Inter, sans-serif; color: #ddd; }
  #ui input { flex: 1; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="pp">play</button><input id="sc" type="range" min="0" max="1000" value="0"><span id="tt">0.0 s</span></div>
<script>
'use strict';
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const X = cv.getContext('2d');

// ------------------------------------------------------------------ palette (6 hues + greys)
const C = {
  bg: '#0a0e16', text: '#eef2f8', mute: '#9aa5b9', dim: '#5b667a', line: '#2b3649',
  frz: '#4da3ff',   // frozen  (cool)
  trn: '#ff9f43',   // trained (warm)
  cch: '#3ddc97',   // cached embedding tables / text space
  rule: '#ff5d73',  // pruning, rules, safety
  img: '#b48cff',   // imagination, audio
  hl: '#ffd166'     // highlight / selection / output
};
const KIND = { frz: C.frz, trn: C.trn, cch: C.cch, rule: C.rule, img: C.img, hl: C.hl, inp: '#aeb8ca', grey: C.dim };
const FONT = 'Inter, "DejaVu Sans", sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';

// ------------------------------------------------------------------ math / easing
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const E = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const EO = u => { u = clamp(u); return 1 - Math.pow(1 - u, 3); };
const P = (t, a, b) => clamp((t - a) / (b - a));
const EP = (t, a, b) => E(P(t, a, b));
// alpha: fade in at a (over f), and out ending at b (if given)
function fade(t, a, b, f = 0.45) {
  const i = EO(P(t, a, a + f));
  if (b === undefined) return i;
  return Math.min(i, 1 - E(P(t, b - f, b)));
}
const pop = (t, a) => 0.86 + 0.14 * EO(P(t, a, a + 0.5));
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const font = (sz, wt = 500, mono = false) => `${wt} ${sz}px ${mono ? MONO : FONT}`;

// ------------------------------------------------------------------ text
function wrap(s, maxW) {
  const words = s.split(' '); const out = []; let cur = '';
  for (const w of words) { const t2 = cur ? cur + ' ' + w : w; if (X.measureText(t2).width > maxW && cur) { out.push(cur); cur = w; } else cur = t2; }
  if (cur) out.push(cur); return out;
}
function T(s, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= 0.003) return 0;
  X.save(); X.globalAlpha *= a; X.font = font(o.size || 20, o.weight || 500, o.mono);
  X.fillStyle = o.color || C.text; X.textAlign = o.align || 'left'; X.textBaseline = o.base || 'middle';
  if (o.ls) X.letterSpacing = o.ls + 'px';
  let n = 1;
  if (o.maxW) {
    const L = wrap(s, o.maxW); const lh = (o.size || 20) * (o.lh || 1.3);
    const y0 = o.vc ? y - (L.length - 1) * lh / 2 : y;
    L.forEach((l, i) => X.fillText(l, x, y0 + i * lh)); n = L.length;
  } else X.fillText(s, x, y);
  X.restore(); return n;
}
function TW(s, sz, wt = 500, mono = false) { X.font = font(sz, wt, mono); return X.measureText(s).width; }

// ------------------------------------------------------------------ shapes
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function lockIcon(cx, cy, s, col) {
  X.save(); X.translate(cx, cy); X.scale(s, s); X.strokeStyle = col; X.fillStyle = col; X.lineWidth = 2.6;
  X.beginPath(); X.arc(0, -3, 6, Math.PI, 0); X.lineTo(6, 1); X.moveTo(-6, -3); X.lineTo(-6, 1); X.stroke();
  rr(-9, 0, 18, 13, 3); X.fill(); X.fillStyle = '#0a0e16'; X.beginPath(); X.arc(0, 6, 2.2, 0, 7); X.fill(); X.restore();
}
function spark(cx, cy, col, s = 1) {
  X.save(); X.translate(cx, cy); X.scale(s, s); X.fillStyle = col; X.beginPath();
  for (let i = 0; i < 8; i++) { const r = i % 2 ? 3 : 9; const a = i * Math.PI / 4 - Math.PI / 2; X.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  X.closePath(); X.fill(); X.restore();
}
function box(x, y, w, h, o = {}) {
  const a = o.a ?? 1; if (a <= 0.003) return;
  const col = o.col || KIND[o.kind || 'inp'];
  X.save(); X.globalAlpha *= a;
  const s = o.s ?? 1; if (s !== 1) { X.translate(x + w / 2, y + h / 2); X.scale(s, s); X.translate(-(x + w / 2), -(y + h / 2)); }
  rr(x, y, w, h, o.r ?? 12); if (o.solid !== false) { X.fillStyle = '#0d131d'; X.fill(); } X.fillStyle = o.fill || hexA(col, o.fa ?? 0.12); X.fill();
  if (o.glow) { X.save(); X.shadowColor = col; X.shadowBlur = o.glow; X.lineWidth = 2; X.strokeStyle = col; X.stroke(); X.restore(); }
  X.lineWidth = o.lw || 2.2; X.strokeStyle = hexA(col, o.sa ?? 0.9);
  if (o.dash === 'cached') X.setLineDash([11, 7]); else if (o.dash === 'optional') X.setLineDash([2, 6]);
  X.lineCap = 'round'; X.stroke(); X.setLineDash([]);
  const pad = o.pad ?? 16, ts = o.ts || 24, ss = o.ss || 18, al = o.align || 'center';
  const icon = (o.lock || o.spark) ? 30 : 0;
  const tx = al === 'center' ? x + w / 2 : x + pad;
  const iw = w - 2 * pad - icon * (al === 'center' ? 2 : 1);
  X.font = font(ts, o.tw || 650); const tl = o.title ? wrap(o.title, iw) : [];
  X.font = font(ss, o.sw || 450, o.smono); const sl = o.sub ? wrap(o.sub, iw) : [];
  const gap = (tl.length && sl.length) ? 7 : 0; const th = tl.length * ts * 1.18 + gap + sl.length * ss * 1.3;
  let cy = o.valign === 'top' ? y + pad : y + h / 2 - th / 2 + 1;
  X.textAlign = al === 'center' ? 'center' : 'left'; X.textBaseline = 'top';
  X.font = font(ts, o.tw || 650); X.fillStyle = o.tc || C.text; tl.forEach((l, i) => X.fillText(l, tx, cy + i * ts * 1.18));
  cy += tl.length * ts * 1.18 + gap;
  X.font = font(ss, o.sw || 450, o.smono); X.fillStyle = o.sc || C.mute; sl.forEach((l, i) => X.fillText(l, tx, cy + i * ss * 1.3));
  if (o.lock) lockIcon(x + w - 22, y + 21, 0.9, col);
  if (o.spark) spark(x + w - 22, y + 21, col, 0.9);
  if (o.tag) { X.font = font(13, 700); X.letterSpacing = '1px'; X.fillStyle = hexA(col, 0.95); X.textAlign = 'right'; X.textBaseline = 'bottom'; X.fillText(o.tag.toUpperCase(), x + w - 12, y + h - 7); }
  X.restore();
}
function panel(x, y, w, h, title, o = {}) {
  const a = o.a ?? 1; if (a <= 0.003) return;
  X.save(); X.globalAlpha *= a; rr(x, y, w, h, 16); X.fillStyle = 'rgba(19,26,39,0.78)'; X.fill();
  X.lineWidth = 1.5; X.strokeStyle = o.col ? hexA(o.col, 0.6) : 'rgba(84,100,128,0.6)'; if (o.dash) X.setLineDash(o.dash); X.stroke(); X.setLineDash([]);
  if (title) { X.fillStyle = o.col || C.mute; X.beginPath(); X.arc(x + 24, y + 28, 5, 0, 7); X.fill(); T(title, x + 38, y + 29, { size: o.ts || 17, weight: 700, color: o.col || C.mute, ls: 1.2 }); }
  X.restore();
}
function chip(x, y, s, o = {}) {
  const a = o.a ?? 1; const sz = o.size || 17; const w = TW(s, sz, o.weight || 600, o.mono) + (o.padx ?? 13) * 2; const h = sz + 14;
  const col = o.col || C.mute; const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  if (a <= 0.003) return w;
  X.save(); X.globalAlpha *= a; rr(x0, y - h / 2, w, h, h / 2); X.fillStyle = hexA(col, o.fa ?? 0.15); X.fill();
  X.strokeStyle = hexA(col, 0.85); X.lineWidth = 1.5; if (o.dash) X.setLineDash(o.dash); X.stroke(); X.setLineDash([]);
  T(s, x0 + w / 2, y + 1, { size: sz, color: o.tc || col, align: 'center', weight: o.weight || 600, mono: o.mono });
  X.restore(); return w;
}
// evidence-class tag
function ev(x, y, cls, o = {}) { return chip(x, y, cls, { size: 12, col: '#8b95a8', fa: 0.08, padx: 8, weight: 700, a: o.a ?? 1, align: o.align }); }

// ------------------------------------------------------------------ arrows and flowing particles
function segs(pts) { const s = []; let L = 0; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); s.push(l); L += l; } return [s, L]; }
function at(pts, d) {
  const [s, L] = segs(pts); d = clamp(d, 0, L);
  for (let i = 0; i < s.length; i++) {
    if (d <= s[i] || i === s.length - 1) { const u = s[i] ? d / s[i] : 0; const a = pts[i], b = pts[i + 1]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, Math.atan2(b[1] - a[1], b[0] - a[0])]; }
    d -= s[i];
  }
  return [pts[0][0], pts[0][1], 0];
}
function arrow(pts, o = {}) {
  const p = o.p ?? 1; if (p <= 0.002) return; const a = o.a ?? 1; if (a <= 0.003) return;
  const [s, L] = segs(pts); const D = L * p; const col = o.col || C.mute;
  X.save(); X.globalAlpha *= a; X.strokeStyle = col; X.fillStyle = col; X.lineWidth = o.w || 2.5; X.lineCap = 'round'; X.lineJoin = 'round';
  if (o.dash) X.setLineDash(o.dash);
  X.beginPath(); X.moveTo(pts[0][0], pts[0][1]); let rem = D;
  for (let i = 0; i < s.length; i++) { const A = pts[i], B = pts[i + 1]; if (rem >= s[i]) { X.lineTo(B[0], B[1]); rem -= s[i]; } else { const u = rem / s[i]; X.lineTo(A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u); break; } }
  X.stroke(); X.setLineDash([]);
  if (o.head !== false) {
    const [hx, hy, an] = at(pts, D); const hs = o.hs || 12;
    X.beginPath(); X.moveTo(hx + Math.cos(an) * 2, hy + Math.sin(an) * 2); X.lineTo(hx - hs * Math.cos(an - 0.42), hy - hs * Math.sin(an - 0.42)); X.lineTo(hx - hs * Math.cos(an + 0.42), hy - hs * Math.sin(an + 0.42)); X.closePath(); X.fill();
  }
  X.restore();
}
function flow(pts, t, o = {}) {
  const a = o.a ?? 1; if (a <= 0.003) return;
  const [, L] = segs(pts); const n = o.n || 4; const sp = o.speed || 170; const col = o.col || C.hl; const r = o.r || 4.5;
  X.save(); X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 12;
  for (let i = 0; i < n; i++) {
    const d = ((t * sp) + i * L / n) % L; const [px, py] = at(pts, d);
    X.globalAlpha = a * clamp(Math.min(d, L - d) / 26);
    if (o.sq) X.fillRect(px - r, py - r, 2 * r, 2 * r); else { X.beginPath(); X.arc(px, py, r, 0, 7); X.fill(); }
  }
  X.restore();
}
function poly(pts, o = {}) {
  const a = o.a ?? 1; if (a <= 0.003 || pts.length < 2) return;
  X.save(); X.globalAlpha *= a; X.strokeStyle = o.col || C.mute; X.lineWidth = o.w || 2; X.lineCap = 'round'; X.lineJoin = 'round';
  if (o.dash) X.setLineDash(o.dash); X.beginPath(); X.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) X.lineTo(pts[i][0], pts[i][1]); X.stroke(); X.restore();
}

// ------------------------------------------------------------------ icons
function icon(kind, cx, cy, s, col, a = 1) {
  if (a <= 0.003) return;
  X.save(); X.globalAlpha *= a; X.translate(cx, cy); X.scale(s, s); X.strokeStyle = col; X.fillStyle = col; X.lineWidth = 2.4; X.lineCap = 'round'; X.lineJoin = 'round';
  if (kind === 'cam') { rr(-17, -10, 34, 23, 4); X.stroke(); X.beginPath(); X.arc(0, 1.5, 6.5, 0, 7); X.stroke(); rr(-7, -15, 12, 5, 2); X.stroke(); }
  else if (kind === 'frames') { for (let i = 2; i >= 0; i--) { rr(-15 + i * 5, -12 + i * 5, 22, 15, 3); X.fillStyle = '#121a27'; X.fill(); X.stroke(); } }
  else if (kind === 'gauge') { X.beginPath(); X.arc(0, 5, 15, Math.PI, 2 * Math.PI); X.stroke(); X.beginPath(); X.moveTo(0, 5); X.lineTo(9, -6); X.stroke(); X.beginPath(); X.arc(0, 5, 2.5, 0, 7); X.fill(); }
  else if (kind === 'nav') { X.beginPath(); X.moveTo(-8, 14); X.lineTo(-8, 0); X.quadraticCurveTo(-8, -8, 0, -8); X.lineTo(9, -8); X.stroke(); X.beginPath(); X.moveTo(14, -8); X.lineTo(7, -14); X.lineTo(7, -2); X.closePath(); X.fill(); }
  else if (kind === 'mic') { rr(-6, -16, 12, 21, 6); X.stroke(); X.beginPath(); X.arc(0, -3, 11, 0.15, Math.PI - 0.15); X.stroke(); X.beginPath(); X.moveTo(0, 8); X.lineTo(0, 15); X.moveTo(-7, 15); X.lineTo(7, 15); X.stroke(); }
  else if (kind === 'globe') { X.beginPath(); X.arc(0, 0, 14, 0, 7); X.stroke(); X.beginPath(); X.ellipse(0, 0, 6, 14, 0, 0, 7); X.stroke(); X.beginPath(); X.moveTo(-14, 0); X.lineTo(14, 0); X.stroke(); }
  else if (kind === 'text') { X.beginPath(); X.moveTo(-12, -10); X.lineTo(12, -10); X.moveTo(0, -10); X.lineTo(0, 12); X.stroke(); }
  else if (kind === 'wave') { X.beginPath(); for (let i = -14; i <= 14; i += 1) { X.lineTo(i, Math.sin(i * 0.9) * (8 - Math.abs(i) * 0.4)); } X.stroke(); }
  X.restore();
}
function carTop(cx, cy, w, h, col, a = 1) {
  if (a <= 0.003) return;
  X.save(); X.globalAlpha *= a; X.translate(cx, cy); rr(-w / 2, -h / 2, w, h, w * 0.28); X.fillStyle = col; X.fill();
  X.fillStyle = 'rgba(8,12,20,0.55)'; rr(-w * 0.34, -h * 0.26, w * 0.68, h * 0.18, 3); X.fill(); rr(-w * 0.32, h * 0.18, w * 0.64, h * 0.12, 3); X.fill(); X.restore();
}
function roadThumb(x, y, w, h, a = 1) {
  if (a <= 0.003) return;
  X.save(); X.globalAlpha *= a; rr(x, y, w, h, 8); X.save(); X.clip();
  const g = X.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#22324a'); g.addColorStop(0.45, '#2c3c55'); g.addColorStop(0.46, '#1b2230'); g.addColorStop(1, '#121822');
  X.fillStyle = g; X.fillRect(x, y, w, h);
  X.fillStyle = '#2a3140'; X.beginPath(); X.moveTo(x + w * 0.46, y + h * 0.46); X.lineTo(x + w * 0.54, y + h * 0.46); X.lineTo(x + w * 1.0, y + h); X.lineTo(x, y + h); X.closePath(); X.fill();
  X.strokeStyle = 'rgba(230,236,245,0.75)'; X.lineWidth = 2; X.setLineDash([8, 8]);
  X.beginPath(); X.moveTo(x + w * 0.5, y + h * 0.47); X.lineTo(x + w * 0.5, y + h); X.stroke(); X.setLineDash([]);
  X.beginPath(); X.moveTo(x + w * 0.465, y + h * 0.46); X.lineTo(x + w * 0.06, y + h); X.moveTo(x + w * 0.535, y + h * 0.46); X.lineTo(x + w * 0.94, y + h); X.stroke();
  X.fillStyle = '#c96a5a'; rr(x + w * 0.515, y + h * 0.58, w * 0.05, h * 0.11, 2); X.fill();
  X.fillStyle = '#7fa0c8'; rr(x + w * 0.36, y + h * 0.66, w * 0.07, h * 0.14, 2); X.fill();
  X.restore(); rr(x, y, w, h, 8); X.strokeStyle = 'rgba(170,184,206,0.6)'; X.lineWidth = 1.5; X.stroke(); X.restore();
}
function vec(x, y, n, cw, ch, col, o = {}) { // a vector drawn as n cells
  const a = o.a ?? 1; if (a <= 0.003) return;
  X.save(); X.globalAlpha *= a;
  for (let i = 0; i < n; i++) {
    const v = 0.25 + 0.75 * hash(i * 7.3 + (o.seed || 0));
    X.fillStyle = hexA(col, 0.25 + 0.7 * v);
    if (o.vertical) X.fillRect(x, y + i * (ch + 2), cw, ch); else X.fillRect(x + i * (cw + 2), y, cw, ch);
  }
  X.restore();
}

// ------------------------------------------------------------------ background (static, deterministic)
const BGC = document.createElement('canvas'); BGC.width = W; BGC.height = H;
(function () {
  const b = BGC.getContext('2d'); const g = b.createRadialGradient(900, 480, 80, 960, 540, 1250);
  g.addColorStop(0, '#111827'); g.addColorStop(1, '#06090e'); b.fillStyle = g; b.fillRect(0, 0, W, H);
  b.fillStyle = 'rgba(140,160,200,0.055)'; for (let x = 20; x < W; x += 40) for (let y = 20; y < H; y += 40) b.fillRect(x, y, 2, 2);
})();

// ================================================================== SCENES
// Each scene: function (t, d) with t = seconds since chapter start.

// ---------- 1. The problem and the idea
function scene1(t) {
  const aA = fade(t, 1.3, 9.0, 0.5);
  if (aA > 0) {
    panel(100, 290, 790, 540, 'GENERATE · TYPICAL DRIVING VLA', { a: aA, col: '#8b95a8' });
    const n = clamp(Math.floor((t - 2.0) / 0.32), 0, 16);
    X.save(); X.globalAlpha *= aA;
    // weight-streaming bar
    box(150, 350, 690, 66, { kind: 'grey', title: 'all weights streamed from memory', sub: 'once for every generated token', ts: 19, ss: 16, a: 1 });
    flow([[160, 430], [830, 430]], t, { n: 9, speed: 520, col: '#8b95a8', r: 3 });
    for (let i = 0; i < 16; i++) {
      const x = 160 + (i % 8) * 85, y = 480 + Math.floor(i / 8) * 92;
      if (i < n) box(x, y, 68, 68, { kind: 'grey', title: 'tok', sub: String(i + 1), ts: 15, ss: 14, r: 10, s: pop(t, 2.0 + i * 0.32) });
      else if (i === n) { X.save(); X.globalAlpha *= 0.5 + 0.5 * Math.sin(t * 10); rr(x, y, 68, 68, 10); X.strokeStyle = C.mute; X.setLineDash([4, 5]); X.lineWidth = 2; X.stroke(); X.restore(); }
    }
    T('one token at a time → bound by memory bandwidth', 495, 712, { size: 22, weight: 650, align: 'center' });
    T('on an in-vehicle computer (paper, abstract)', 495, 746, { size: 17, color: C.mute, align: 'center' });
    X.restore();
  }
  const aB = fade(t, 4.6, 9.0, 0.5);
  if (aB > 0) {
    panel(1010, 290, 830, 540, 'CHOOSE · HiCAP', { a: aB, col: C.trn });
    X.save(); X.globalAlpha *= aB;
    vec(1060, 370, 14, 26, 22, C.trn, { vertical: true, seed: 3 });
    T('state s', 1073, 720, { size: 17, color: C.trn, align: 'center', weight: 650 });
    const names = ['LANE_KEEP', 'TURN_L', 'TURN_R', 'HOLD', 'CREEP', 'STOP', 'FOLLOW', 'DECELERATE', 'ACCELERATE', 'KEEP'];
    const sc = [0.55, 0.2, 0.15, 0.25, 0.3, 0.35, 0.92, 0.6, 0.3, 0.5];
    const win = EP(t, 6.6, 7.4);
    names.forEach((nm, i) => {
      const col = i % 2, row = Math.floor(i / 2); const x = 1240 + col * 290, y = 360 + row * 74;
      const ap = fade(t, 5.0 + i * 0.12);
      arrow([[1100, 380 + i * 34], [x - 6, y + 26]], { col: hexA(C.cch, 0.25 + 0.5 * sc[i]), w: 1.4, head: false, a: ap * EP(t, 5.6, 6.4) });
      box(x, y, 262, 54, { kind: 'cch', a: ap, title: nm, ts: 17, align: 'left', pad: 14, glow: (i === 6 ? 22 * win : 0), col: (i === 6 && win > 0.5) ? C.hl : C.cch });
      X.fillStyle = hexA(i === 6 && win > 0.5 ? C.hl : C.cch, 0.85 * ap); X.fillRect(x + 150, y + 22, 96 * sc[i] * EP(t, 5.8, 6.6), 10);
    });
    T('one prefill + a dot-product search over cached, text-defined action embeddings', 1425, 754, { size: 18, align: 'center', weight: 600, maxW: 740 });
    ev(1425, 806, 'ILLUSTRATIVE SCORES', { align: 'center' });
    X.restore();
  }

let acc = 0; CH.forEach(c => { c.start = acc; acc += c.dur; });
const TOTAL = acc;

// ================================================================== persistent UI
const MM = { x: 1530, y: 20, w: 370, h: 232 };
const MMN = {
  cam: [10, 30, 64, 22, 'inp', 'CAMERAS'], mot: [80, 30, 64, 22, 'trn', 'MOTION'], ego: [150, 30, 64, 22, 'inp', 'EGO · NAV'],
  mic: [220, 30, 50, 22, 'inp', 'MIC', 'optional'], vlm: [10, 58, 134, 22, 'frz', 'FROZEN VLM'], aud: [220, 58, 50, 22, 'trn', 'BRIDGE'],
  txt: [278, 30, 82, 50, 'cch', 'TEXT SPACE', 'cached'], fus: [10, 88, 350, 22, 'trn', 'FUSION · LEVEL QUERIES'],
  s1: [10, 118, 112, 22, 'trn', 'S1 STRATEGIC'], s2: [129, 118, 112, 22, 'trn', 'S2 TACTICAL'], s3: [248, 118, 112, 22, 'trn', 'S3 TRAJECTORY'],
  prn: [10, 148, 112, 22, 'rule', 'PRUNE · RULES'], img: [129, 148, 112, 22, 'img', 'IMAGINATION'], out: [248, 148, 112, 22, 'hl', 'OUTPUT'],

const MML = [['cam', 'vlm'], ['vlm', 'fus'], ['mot', 'fus'], ['ego', 'fus'], ['mic', 'aud'], ['aud', 'fus'], ['txt', 'fus'], ['fus', 's1'], ['fus', 's2'], ['fus', 's3'], ['s1', 'prn'], ['s2', 'img'], ['s3', 'out'], ['prn', 'img'], ['img', 'out']];
const TRAINED = ['mot', 'aud', 'fus', 's1', 's2', 's3', 'img'];
function minimap(keys, t) {
  const { x, y, w, h } = MM; const all = keys.includes('all'); const act = keys.includes('trained') ? TRAINED : keys;
  X.save(); rr(x, y, w, h, 12); X.fillStyle = 'rgba(12,17,26,0.9)'; X.fill(); X.strokeStyle = 'rgba(90,106,134,0.6)'; X.lineWidth = 1.2; X.stroke();
  T('ARCHITECTURE', x + 12, y + 14, { size: 11, weight: 800, color: C.mute, ls: 1.5 });
  const ctr = k => { const n = MMN[k]; return [x + n[0] + n[2] / 2, y + n[1] + n[3] / 2, n]; };
  MML.forEach(([a, b]) => {
    const [ax, ay, na] = ctr(a), [bx, by, nb] = ctr(b);
    const on = all || (act.includes(a) && act.includes(b));
    X.strokeStyle = on ? 'rgba(220,230,245,0.55)' : 'rgba(120,135,160,0.22)'; X.lineWidth = 1;
    X.beginPath();
    if (Math.abs(ay - by) < 4) { X.moveTo(x + na[0] + na[2], ay); X.lineTo(x + nb[0], by); }
    else { const sx = clamp(ax, x + nb[0] + 8, x + nb[0] + nb[2] - 8); X.moveTo(sx, y + na[1] + na[3]); X.lineTo(sx, y + nb[1]); }
    X.stroke();
  });
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  for (const k in MMN) {
    const n = MMN[k]; const on = all || act.includes(k); const col = KIND[n[4]];
    rr(x + n[0], y + n[1], n[2], n[3], 5); X.fillStyle = '#0c111a'; X.fill();
    X.save(); X.globalAlpha = on ? 1 : 0.3; rr(x + n[0], y + n[1], n[2], n[3], 5);
    X.fillStyle = hexA(col, on && !all ? 0.32 + 0.12 * pulse : 0.14); X.fill();
    if (on && !all) { X.shadowColor = col; X.shadowBlur = 10 + 6 * pulse; }
    X.strokeStyle = col; X.lineWidth = on && !all ? 2 : 1.2;
    if (n[6] === 'optional') X.setLineDash([2, 3]); else if (n[6] === 'cached') X.setLineDash([5, 3]);
    X.stroke(); X.setLineDash([]); X.shadowBlur = 0;
    T(n[5], x + n[0] + n[2] / 2, y + n[1] + n[3] / 2 + 0.5, { size: n[2] < 60 ? 8.5 : 9.5, weight: 700, align: 'center', color: on ? C.text : C.mute, maxW: n[2] - 4, vc: true, lh: 1.1 });
    if (k === 'vlm') lockIcon(x + n[0] + n[2] - 10, y + n[1] + 11, 0.5, col);
    X.restore();
  }

}
function titleCard(lt, ci) {

}

    X.globalAlpha = a; rr(960 - w / 2, 1046 - hh, w, hh, 14); X.fillStyle = 'rgba(4,6,10,0.82)'; X.fill(); X.strokeStyle = 'rgba(120,135,160,0.35)'; X.lineWidth = 1; X.stroke();
    X.fillStyle = C.text; X.textAlign = 'center'; X.textBaseline = 'middle'; L.forEach((l, i) => X.fillText(l, 960, 1046 - hh + 15 + 22 + i * 44));

}
function progress(t) {
  const x0 = 60, x1 = 1860, y = 1066; const sc = (x1 - x0) / TOTAL;
  CH.forEach((c, i) => {
    const a = x0 + c.start * sc + 2, b = x0 + (c.start + c.dur) * sc - 2;

  });
}
function chapterAt(t) { for (let i = CH.length - 1; i >= 0; i--) if (t >= CH[i].start) return i; return 0; }

// ================================================================== renderFrame
function renderFrame(t) {
  t = clamp(t, 0, TOTAL - 1e-6);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.shadowBlur = 0; X.setLineDash([]); X.letterSpacing = '0px';
  X.drawImage(BGC, 0, 0);

  X.save(); X.globalAlpha = 1 - E(P(lt, ch.dur - 0.35, ch.dur)); ch.draw(lt, ch.dur); X.restore();
  X.globalAlpha = 1; X.shadowBlur = 0; X.setLineDash([]); X.letterSpacing = '0px';
  minimap(ch.map, t);
  titleCard(lt, ci);
  captions(lt, ci);
  progress(t);

}
function checkCaptions() {
  const out = [];
  CH.forEach((c, i) => c.caps.forEach(k => { X.font = font(CAP_SIZE, 550); const L = wrap(k[2], CAP_MAXW); out.push({ ch: i + 1, t0: k[0], t1: k[1], dur: +(k[1] - k[0]).toFixed(2), lines: L.length, width: Math.round(X.measureText(k[2]).width), text: k[2] }); }));
  return out;
}
window.renderFrame = renderFrame;
window.checkCaptions = checkCaptions;
window.TOTAL = TOTAL;
window.STORYBOARD = CH.map((c, i) => ({ n: i + 1, title: c.title, start: c.start, dur: c.dur, vis: c.vis, src: c.src, map: c.map, caps: c.caps }));
window.READY = false;
document.fonts.load('700 20px Inter').then(() => document.fonts.load('500 20px Inter')).then(() => document.fonts.load('500 20px "DejaVu Sans Mono"')).catch(() => {}).then(() => { renderFrame(0); window.READY = true; });

// ------------------------------------------------------------------ preview player (not used by the renderer)
if (!/render/.test(location.search)) {
  const ui = document.getElementById('ui'); ui.style.display = 'flex';
  const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
  let playing = false, cur = 0, last = 0;
  const show = () => { renderFrame(cur); sc.value = Math.round(cur / TOTAL * 1000); tt.textContent = cur.toFixed(1) + ' s / ' + TOTAL + ' s'; };
  sc.oninput = () => { cur = sc.value / 1000 * TOTAL; show(); };
  const loop = now => { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur >= TOTAL) { cur = 0; } show(); requestAnimationFrame(loop); };
  const toggle = () => { playing = !playing; pp.textContent = playing ? 'pause' : 'play'; if (playing) { last = performance.now(); requestAnimationFrame(loop); } };
  pp.onclick = toggle; document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.transformOrigin = '0 0'; cv.style.transform = `scale(${s})`; };
  addEventListener('resize', fit); fit();
}
