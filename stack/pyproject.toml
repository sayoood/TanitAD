[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanitad"
version = "0.0.1"
description = "TanitAD - hierarchical latent world-model stack for autonomous driving (4B architecture)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# MetaDrive native runtime deps (both ship cp313 wheels). MetaDrive itself is
# NOT on this list: its PyPI package (metadrive-simulator 0.2.6.0) pins the
# unbuildable gym==0.19.0 and fails on py3.13 -- install MetaDrive from source
# (GitHub main, gymnasium-based) in a supervised session. See
# tanitad/data/metadrive_env.py docstring for the measured setup verdict.
sim = ["panda3d>=1.10", "gymnasium>=0.28"]
# TLS behind the dev-machine intercepting proxy + authenticated downloads
# (Hugging Face etc.). truststore routes verification through the OS trust store.
net = ["truststore>=0.9"]
# Real-data ingestion (D-009/D-012): video decode, HF pulls, parquet metadata
# (PhysicalAI egomotion/clip-index), episode visualization.
real = ["av>=12", "huggingface_hub>=0.24", "truststore>=0.9",
        "pandas>=2.0", "pyarrow>=15", "pillow>=10"]
# Trajectory reconstruction from smartphone dashcam recordings
# (tanitad/data/trajrecon): Sensor Logger CSV ingest, EKF+RTS smoothing, optical
# -flow/gyro time sync, camera calibration, BEV + in-image overlay rendering.
# ALSO REQUIRES ffmpeg AND ffprobe ON PATH -- trajrecon.timesync probes container
# PTS with ffprobe, and neither is a pip dependency. `apt-get install ffmpeg`
# supplies both; imageio-ffmpeg supplies ffmpeg ONLY and is not sufficient.
#
# ⚠️ opencv is capped BELOW 5. MEASURED 2026-08-08 on the 14-19-54 recording:
# cv2 5.0.0 changed `HoughLinesP` to return shape (N, 4) where every 4.x returns
# (N, 1, 4). `lane_calib.py:182` iterates `seg[:, 0]`, which under 5.x is a 1-D
# array of scalars, so the unpack raises
#     "cannot unpack non-iterable numpy.int32 object"
# and the pipeline DEGRADES RATHER THAN FAILS: lane calibration is skipped with a
# warning, the lateral offset silently falls back to the -0.35 prior, and the run
# still reports VERDICT: OK. That is the dangerous shape -- a dependency break
# that costs a measurement instead of raising.
# The unbounded `>=4.9` is what admitted 5.x. Capping is preferred over patching
# `lane_calib.py`, because the 24 upstream modules are landed byte-exact and that
# provenance is worth more than avoiding a version pin. (`vp_calib.py:120` is NOT
# affected -- it uses `.reshape(-1, 4)`, which is correct under both shapes.)
trajrecon = ["opencv-python>=4.9,<5", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["tanitad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: live-simulator or long-running tests (skipped/needs .[sim] + source MetaDrive)",
]
