⚠ The NavSim `driving_command` is a ROUTE-LEVEL ORACLE, not a driver input: it is a function of the ego pose now + the nuPlan route + the map (W2 reproduced it 1,902/1,902 with OpenScene&#x27;s own function), and that route is the EXPERT&#x27;S DRIVEN PATH at roadblock granularity (79.8 % of forward blocks driven vs a 34.6 % null control). On stage 2 the command and the route are COPIED from the expert&#x27;s own frame (5,462/5,462 navhard). ⇒ an arm that declares the command is NOT evidence of route-following, and its nav-compliance readout is not a route claim." tabindex="0"><title>A4 · frames-blind (grey): 0.0000 (n 220)
⚠ The NavSim `driving_command` is a ROUTE-LEVEL ORACLE, not a driver input: it is a function of the ego pose now + the nuPlan route + the map (W2 reproduced it 1,902/1,902 with OpenScene&#x27;s own function), and that route is the EXPERT&#x27;S DRIVEN PATH at roadblock granularity (79.8 % of forward blocks driven vs a 34.6 % null control). On stage 2 the command and the route are COPIED from the expert&#x27;s own frame (5,462/5,462 navhard). ⇒ an arm that declares the command is NOT evidence of route-following, and its nav-compliance readout is not a route claim.</title></rect><text class="t-ink t-num" x="256" y="61" text-anchor="start" dominant-baseline="middle" data-v="0.0" data-k="arms/A4_blind_ego_cmd/headline/x100" data-fmt="f4">0.0000</text><text class="t-mut t-sm" x="298.4" y="61" text-anchor="start" dominant-baseline="middle">⚠ oracle cmd</text></g><g data-pub="warmup.hf_cv"><text class="t-ink" x="240" y="87" text-anchor="end" dominant-baseline="middle" data-role="pub-label" data-tip="baseline_constant_velocity (HF warmup leaderboard)">baseline_constant_velocity (HF warm…</text><path class="m-pub" d="M250,80 H449.89 Q453.89,80 453.89,84 V90 Q453.89,94 449.89,94 H250 Z" data-v="18.5356" data-tip="baseline_constant_velocity (HF warmup leaderboard): 18.5356 — HF warmup leaderboard row, INHERITED via products/P7-TanitEval/benchmarks/NAVSIM_PROTOCOL.md §6.3 (retrieved 2026-08-23)" tabindex="0"><title>baseline_constant_velocity (HF warmup leaderboard): 18.5356 — HF warmup leaderboard row, INHERITED via products/P7-TanitEval/benchmarks/NAVSIM_PROTOCOL.md §6.3 (retrieved 2026-08-23)</title></path><text class="t-ink t-num" x="459.89" y="87" text-anchor="start" dominant-baseline="middle" data-v="18.5356" data-fmt="f4">18.5356</text><text class="t-mut t-sm" x="508.69" y="87" text-anchor="start" dominant-baseline="middle">published · INHERITED</text></g><g data-arm="STOP" data-ref="1"><line class="ref" x1="580.99" y1="34" x2="580.99" y2="100"/><text class="t-2 t-sm t-b"