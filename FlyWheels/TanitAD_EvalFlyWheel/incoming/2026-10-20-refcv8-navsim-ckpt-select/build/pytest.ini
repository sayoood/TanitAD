# Pins pytest's rootdir to THIS build directory whatever the caller's cwd (node ids read "tests/test_*.py::..." from anywhere).
# No option is set on purpose: it changes the node-id prefix and nothing else.
[pytest]
markers =
    e2e: spawns a real subprocess / needs a real tool (excluded from the fast mutation runs)
    devkit: needs the NAVSIM venv + the v1.1 devkit tree + navtest fixtures on the dev box
    bridge: imports the launch tree's refcv6_bridge (BankNavtest416) -- needs the stack + torch
    stitch: runs the REAL E2 stitch (torch + tanitad stack + navtest rig pickles on D:)
