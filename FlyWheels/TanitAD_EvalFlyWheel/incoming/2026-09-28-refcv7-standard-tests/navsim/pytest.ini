# Pins pytest's rootdir to THIS package, whatever the caller's working directory.
#
# Why (MEASURED 2026-10-04 00:34 Berlin): run_navsim_refcv7.py decides K0/KD from the literal
# pytest line "PASSED tests/test_model_seam7.py::test_K0...". Launched with cwd C:\Users\Admin
# (a different drive from this package), pytest picked rootdir = the cwd, could not express the
# D: test file relative to it, and printed "PASSED ::test_K0_same_seed_is_bit_identical" -- the
# runner read K0 as FAILED and REFUSED CUDA for the step-50,400 warmup split although K0 passed.
# With this file, rootdir = this directory and node ids read "tests/test_*.py::..." from any cwd
# (as they did at steps 5,000 / 30,000, launched from a D: cwd). No option is set here on purpose:
# it changes the node-id prefix and nothing else.
[pytest]
